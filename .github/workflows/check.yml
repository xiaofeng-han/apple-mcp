# Builds and runs the unit tests for every pull request and every push to main, on a GitHub-hosted
# Mac. It uses no secrets: releases are signed and published from a Mac with scripts/release.sh.
# scripts/e2e.py is not run here, since it needs real Notes data and the app's permissions.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's default Xcode can lag behind the one this is developed with; use the newest
      # one installed.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

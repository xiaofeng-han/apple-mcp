# Builds Apple Notes MCP and Apple Reminders MCP (one package), checks that what users and agents
# see has not changed (scripts/golden.py against Tests/Golden), and runs the unit tests, for every
# pull request and every push to main, on a GitHub-hosted Mac. It uses no secrets: releases are
# signed and published from a Mac. scripts/e2e.py is not run here, since it needs real Notes and
# Reminders data and the apps' permissions.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's default Xcode can lag behind the one this is developed with; use the newest
      # one installed.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      # Before the tests, which they do not need, so a test that hangs does not hold them back.
      - name: Golden outputs
        timeout-minutes: 10
        run: |
          bin=$(swift build --show-bin-path)
          /usr/bin/python3 -I scripts/golden.py check notes "$bin/AppleNotesMCP" Tests/Golden/notes
          /usr/bin/python3 -I scripts/golden.py check reminders "$bin/AppleRemindersMCP" Tests/Golden/reminders
      # Under a pseudo-terminal, so the output appears as it is written, and with a time limit, so a
      # test that hangs fails the check in minutes and the log shows where it stopped.
      - name: Test
        timeout-minutes: 10
        run: |
          script -q /dev/null sh -c 'swift test; echo $? > "$RUNNER_TEMP/test-status"'
          exit "$(cat "$RUNNER_TEMP/test-status")"

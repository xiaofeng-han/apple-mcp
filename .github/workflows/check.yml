# Builds Apple Notes MCP and Apple Reminders MCP (one package), checks that what users and agents
# see has not changed (scripts/golden.py against Tests/Golden), and runs the unit tests, for every
# pull request and every push to main, on a GitHub-hosted Mac. It uses no secrets: releases are
# signed and published from a Mac. scripts/e2e.py is not run here, since it needs real Notes and
# Reminders data and the apps' permissions.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's default Xcode can lag behind the one this is developed with; use the newest
      # one installed.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      # Before the tests, which they do not need, so a test that hangs does not hold them back.
      - name: Golden outputs
        timeout-minutes: 10
        run: |
          bin=$(swift build --show-bin-path)
          /usr/bin/python3 -I scripts/golden.py check notes "$bin/AppleNotesMCP" Tests/Golden/notes
          /usr/bin/python3 -I scripts/golden.py check reminders "$bin/AppleRemindersMCP" Tests/Golden/reminders
      # Under a pseudo-terminal, so the output appears as it is written. One at a time: on this
      # runner the tests hang when run in parallel (see the parallel-tests job below).
      - name: Test
        timeout-minutes: 10
        run: |
          script -q /dev/null sh -c 'swift test --no-parallel --verbose; echo $? > "$RUNNER_TEMP/test-status"'
          exit "$(cat "$RUNNER_TEMP/test-status")"

  # Diagnosis only, never fails the check: runs parts of the tests in parallel, as `swift test` does
  # by default, with a time limit each. The last run found NoteModelTests and WireTests pass in
  # parallel and AgentsTests hang (no test finishing in 90 seconds, pure parsing tests included), so
  # this narrows AgentsTests down: suite by suite, and without the test that changes HOME while
  # other tests run.
  parallel-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build the tests
        run: swift build --build-tests
      - name: Parts of AgentsTests in parallel, 60 seconds each
        continue-on-error: true
        run: |
          while read -r label arguments; do
            echo "::group::$label"
            /usr/bin/python3 -I - "$label" $arguments <<'EOF'
          import os, pty, select, signal, subprocess, sys, time
          label, arguments = sys.argv[1], sys.argv[2:]
          leader, follower = pty.openpty()
          process = subprocess.Popen(["swift", "test", "--skip-build", *arguments], stdout=follower, stderr=follower,
                                     stdin=subprocess.DEVNULL, start_new_session=True)
          os.close(follower)
          deadline, finished = time.time() + 60, 0
          while time.time() < deadline and process.poll() is None:
              if select.select([leader], [], [], 1)[0]:
                  try:
                      chunk = os.read(leader, 65536).decode(errors="replace")
                  except OSError:
                      break
                  sys.stdout.write(chunk)
                  finished += chunk.count("✔ Test ") + chunk.count("✘ Test ")
          if process.poll() is None:
              os.killpg(process.pid, signal.SIGKILL)
              print(f"\nRESULT {label}: hung, {finished} tests finished in 60 seconds")
          else:
              print(f"\nRESULT {label}: exit status {process.returncode}, {finished} tests finished")
          EOF
            echo "::endgroup::"
          done <<'LIST'
          JSONTextTests --filter JSONTextTests
          TOMLTextTests --filter TOMLTextTests
          SkillTests --filter SkillTests
          RegistrationTests --filter RegistrationTests
          InstallerChoiceTests --filter InstallerChoiceTests
          InstallerChoiceTests-without-HOME-test --filter InstallerChoiceTests --skip shortensOnlyTheAccountsOwnHome
          AgentsTests-without-HOME-test --filter AgentsTests --skip shortensOnlyTheAccountsOwnHome
          AgentsTests-without-process-tests --filter AgentsTests --skip stopsWhatRunsTooLong|runsWithoutATerminal
          LIST
